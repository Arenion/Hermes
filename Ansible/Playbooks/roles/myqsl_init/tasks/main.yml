- name: Create Mysql db for {{ db_name }}
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    login_host: mysql.rezoleo.fr
    login_user: admin
    login_port: 3306
    login_password: "{{ mysql_secret.secret.password }}"
- name: Create Mysql compte for {{ db_name }}
  community.mysql.mysql_user:
    name: "{{ user_name }}"
    login_host: mysql.rezoleo.fr
    login_user: admin
    login_port: 3306
    login_password: "{{ mysql_secret.secret.password }}"
    priv: "{{db_name}}.*: ALL,GRANT"
